<script>
  // Put the chosen look on before anything draws, so the page doesn't flash
  try { const t = localStorage.getItem("mh-theme"); if (t && t !== "auto") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  /* ---------- Moby's Home: tokens ----------
     Day: cool fog and white. Night: deep navy, where lights glow. Colour: every card in its own hue. */
  :root {
    color-scheme: light;
    --bg: #e8edf4; --bg2: #dfe6f0; --card: #ffffff; --raised: #f3f6fa; --ink: #15213a; --muted: #5d6a82;
    --faint: #93a0b6; --line: #dbe2ec;
    --lamp: #ffaa1d; --heat: #ff6a3d; --media: #7b61ff; --people: #16a873; --sky: #2e8bff; --echo: #0fa9bd;
    --race: #e8364f; --door: #6b7a99; --pc: #4f5bd5; --ok: #16a873; --bad: #e0413a; --warm: #ff6a3d; --blue: #2e8bff;
    --shadow: 0 1px 2px rgba(21, 33, 58, .05), 0 6px 20px rgba(21, 33, 58, .06);
    --glow: 0 10px 34px -6px color-mix(in srgb, var(--lamp) 55%, transparent);
    --wx-cloud: #c3cbd8;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  }
  :root[data-theme="night"] {
    color-scheme: dark;
    --bg: #0b1324; --bg2: #0f1a31; --card: #131e35; --raised: #1a2742; --ink: #e9eff9; --muted: #92a0bb;
    --faint: #5f6e8c; --line: #23314f;
    --lamp: #ffb43a; --heat: #ff7a50; --media: #9783ff; --people: #2fd193; --sky: #4aa3ff; --echo: #2cc8db;
    --race: #ff5a70; --door: #8d9bb8; --pc: #8b95ff; --ok: #2fd193; --bad: #ff6b63; --warm: #ff7a50; --blue: #4aa3ff;
    --shadow: none;
    --glow: 0 0 0 1px color-mix(in srgb, var(--lamp) 60%, transparent), 0 14px 44px -4px color-mix(in srgb, var(--lamp) 45%, transparent);
    --wx-cloud: #7c8aa5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      color-scheme: dark;
      --bg: #0b1324; --bg2: #0f1a31; --card: #131e35; --raised: #1a2742; --ink: #e9eff9; --muted: #92a0bb;
      --faint: #5f6e8c; --line: #23314f;
      --lamp: #ffb43a; --heat: #ff7a50; --media: #9783ff; --people: #2fd193; --sky: #4aa3ff; --echo: #2cc8db;
      --race: #ff5a70; --door: #8d9bb8; --pc: #8b95ff; --ok: #2fd193; --bad: #ff6b63; --warm: #ff7a50; --blue: #4aa3ff;
      --shadow: none;
      --glow: 0 0 0 1px color-mix(in srgb, var(--lamp) 60%, transparent), 0 14px 44px -4px color-mix(in srgb, var(--lamp) 45%, transparent);
      --wx-cloud: #7c8aa5;
    }
  }
  /* Colour mode: Day underneath, with every card washed in its own colour */
  :root[data-theme="colour"] { --bg: #f1eefb; --bg2: #e9f3fb; }

  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--ink); font: 15px/1.45 var(--body);
         background: radial-gradient(1200px 500px at 85% -10%, var(--bg2), transparent 70%), var(--bg);
         min-height: 100vh; -webkit-font-smoothing: antialiased; }
  :root[data-theme="colour"] body {
    background: radial-gradient(900px 420px at 0% 0%, color-mix(in srgb, var(--heat) 18%, transparent), transparent 70%),
                radial-gradient(900px 460px at 100% 10%, color-mix(in srgb, var(--media) 18%, transparent), transparent 70%),
                radial-gradient(900px 500px at 50% 100%, color-mix(in srgb, var(--echo) 14%, transparent), transparent 70%), var(--bg); }
  button, input { font: inherit; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  /* ---------- top of the page ---------- */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
         padding: 18px 28px 0; max-width: 1500px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo { width: 34px; height: 34px; display: block; }
  .brand h1 { font: 650 19px/1 var(--display); margin: 0; letter-spacing: -.01em; }
  .status { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .msg.err { color: var(--bad); }
  .modes { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .modes button { border: 0; background: none; color: var(--muted); padding: 5px 11px; border-radius: 999px; cursor: pointer;
                  font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }
  .modes button svg { width: 14px; height: 14px; }
  .modes button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
  .iconbtn { font-size: 13px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
             border-radius: 999px; padding: 6px 13px; cursor: pointer; }

  .hello { max-width: 1500px; margin: 0 auto; padding: 26px 28px 22px; display: flex; align-items: flex-end;
           justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .hello h2 { font: 700 clamp(30px, 4.2vw, 48px)/1.02 var(--display); letter-spacing: -.025em; margin: 0; }
  .hello .when2 { color: var(--muted); font-size: 16px; margin-top: 8px; }
  .hello .clock { font: 300 clamp(40px, 6vw, 72px)/.9 var(--display); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
  .faces { display: flex; gap: 14px; align-items: flex-end; }
  .face { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .face .av { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
              font: 700 21px var(--display); background: var(--raised); color: var(--faint);
              border: 2px dashed var(--line); }
  .face.in .av { background: var(--people); color: #fff; border: 2px solid var(--card);
                 box-shadow: 0 0 0 3px color-mix(in srgb, var(--people) 35%, transparent); }
  .face.in { color: var(--ink); font-weight: 600; }

  main { padding: 0 28px 40px; max-width: 1500px; margin: 0 auto; }

  /* ---------- quick tiles ---------- */
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  @media (max-width: 1100px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 820px) {
    .bar { padding: 14px 14px 0; } .hello { padding: 18px 14px 16px; } main { padding: 0 12px 32px; }
    .layout { grid-template-columns: minmax(0, 1fr); } .tiles { gap: 10px; }
    .hello .clock { display: none; }
  }

  .card, .tile { background: var(--card); border: 1px solid var(--line); border-radius: 22px;
                 box-shadow: var(--shadow); min-width: 0; position: relative; }
  .card { padding: 20px 22px; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px; }
  .title { font: 650 17px/1.2 var(--display); margin: 0; display: flex; align-items: center; gap: 10px; letter-spacing: -.01em; }
  .sub { font-size: 13px; color: var(--muted); margin: 0; }
  .fold { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; margin: 0;
          color: inherit; cursor: pointer; text-align: left; min-width: 0; }
  .fold .chev { width: 18px; height: 18px; color: var(--faint); transition: transform .2s; flex: none; }
  .fold:hover .chev { color: var(--ink); }
  .card.folded > :not(.head) { display: none; }
  .card.folded .head { margin-bottom: 0; }
  .card.folded .fold .chev { transform: rotate(-90deg); }
  .bub { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none;
         background: color-mix(in srgb, var(--hue, var(--blue)) 15%, transparent); color: var(--hue, var(--blue)); }
  .bub svg { width: 18px; height: 18px; }

  /* each part of the home has its own colour */
  .c-lights, .t-lights { --hue: var(--lamp); }
  .c-media { --hue: var(--media); }  .c-routines { --hue: var(--sky); }  .c-weather { --hue: var(--sky); }
  .c-home { --hue: var(--people); }  .c-pcs { --hue: var(--pc); }  .c-echo { --hue: var(--echo); }  .c-log { --hue: var(--door); }
  .t-heat { --hue: var(--heat); }  .t-race { --hue: var(--race); }  .t-door { --hue: var(--door); }  .t-alarm { --hue: var(--people); }

  :root[data-theme="colour"] .card, :root[data-theme="colour"] .tile {
    background: linear-gradient(160deg, color-mix(in srgb, var(--hue, var(--blue)) 20%, #fff) 0%, #fff 62%);
    border-color: color-mix(in srgb, var(--hue, var(--blue)) 30%, #fff); }
  :root[data-theme="colour"] .title { color: color-mix(in srgb, var(--hue) 70%, #15213a); }

  a.tile { display: block; padding: 16px 18px 18px; color: inherit; text-decoration: none; }
  a.tile:hover { border-color: color-mix(in srgb, var(--hue) 50%, var(--line)); }
  .tile .k { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .tile .v { font: 500 32px/1.1 var(--display); margin: 12px 0 4px; letter-spacing: -.02em; font-variant-numeric: tabular-nums;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .v.word { font-size: 24px; }
  .tile .s { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--faint); vertical-align: middle; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
  .dot.bad { background: var(--bad); } .dot.alert { background: var(--warm); }

  /* ---------- lights and plugs: the ones that are on glow ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .sw { position: relative; text-align: left; border: 1px solid var(--line); background: var(--raised);
        border-radius: 18px; padding: 14px; cursor: pointer; color: inherit;
        display: flex; flex-direction: column; gap: 10px; min-height: 124px;
        transition: background .25s, box-shadow .25s, border-color .25s; }
  .sw:hover { border-color: var(--faint); }
  .sw .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
            background: var(--card); color: var(--faint); transition: background .25s, color .25s; }
  .sw .ic svg { width: 21px; height: 21px; }
  .sw .nm { font-weight: 650; font-size: 15px; line-height: 1.25; }
  .sw .st { font-size: 13px; color: var(--muted); margin-top: auto; }
  .sw.on { border-color: color-mix(in srgb, var(--lamp) 55%, transparent); box-shadow: var(--glow);
           background: radial-gradient(140% 120% at 15% 0%, color-mix(in srgb, var(--lamp) 34%, var(--card)) 0%, var(--card) 70%); }
  .sw.on .ic { background: var(--lamp); color: #3a2400; box-shadow: 0 0 18px color-mix(in srgb, var(--lamp) 70%, transparent); }
  .sw.on .st { color: color-mix(in srgb, var(--lamp) 55%, var(--ink)); font-weight: 600; }
  .sw.off-line { opacity: .5; cursor: default; }
  .sw.busy { opacity: .6; cursor: wait; }
  .sw input[type=range] { width: 100%; accent-color: var(--lamp); margin: 0; }
  .sw.wide { grid-column: span 2; }
  .sws { display: flex; flex-wrap: wrap; gap: 7px; }
  .swatch { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; flex: none;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,.12), 0 0 0 2px var(--card); transition: transform .12s; }
  .swatch:hover, .swatch:focus-visible { transform: scale(1.18); outline: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15), 0 0 0 2px var(--ink); }

  /* ---------- TV, consoles, Chromecasts ---------- */
  .media { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 12px; }
  @media (max-width: 1100px) { .media { grid-template-columns: 1fr 1fr; } .media .tv { grid-column: 1 / -1; } }
  .dev { border: 1px solid var(--line); background: var(--raised); border-radius: 18px; padding: 14px;
         display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .dev.live { background: radial-gradient(140% 120% at 15% 0%, color-mix(in srgb, var(--media) 16%, var(--card)) 0%, var(--card) 70%);
              border-color: color-mix(in srgb, var(--media) 40%, var(--line)); }
  .dev .top { display: flex; align-items: center; gap: 10px; }
  .dev .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
             background: var(--card); color: var(--faint); flex: none; }
  .dev.live .ic { background: var(--media); color: #fff; }
  .dev .ic svg { width: 21px; height: 21px; }
  .dev .nm { font-weight: 650; }
  .dev .st { font-size: 13px; color: var(--muted); }
  .dev.live .st { color: color-mix(in srgb, var(--media) 65%, var(--ink)); font-weight: 600; }
  .dev .game { font: 600 16px/1.2 var(--display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dev .ctrls { display: flex; gap: 6px; flex-wrap: wrap; }
  .dev .ctrls button, .apps button { font-size: 13px; border: 1px solid var(--line); background: var(--card);
            color: var(--ink); border-radius: 999px; padding: 7px 12px; cursor: pointer; }
  .dev .ctrls button:hover, .apps button:hover { border-color: var(--media); }
  .dev .ctrls button.pw { background: var(--media); border-color: var(--media); color: #fff; }
  .apps { display: flex; gap: 6px; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--warm); }
  .playing { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .playing > div { min-width: 0; }
  .playing img { width: 46px; height: 46px; border-radius: 10px; object-fit: cover; flex: none; }
  .casts { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 12px; }
  .casts .np { margin-left: 0; }
  .casts .vol { flex: none; }

  /* ---------- who's home and computers ---------- */
  .whos { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
  .who { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 16px; background: var(--raised);
         border: 1px solid var(--line); min-width: 0; }
  .who > div { min-width: 0; }
  .who .av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none;
             font: 700 15px var(--display); background: var(--line); color: var(--muted); }
  .who.in { background: var(--card); border-color: color-mix(in srgb, var(--people) 40%, var(--line)); }
  .who.in .av { background: var(--people); color: #fff; }
  .who .nm { font-weight: 650; font-size: 14px; }
  .who .st { font-size: 12px; color: var(--muted); line-height: 1.3; }
  .pcs { display: grid; gap: 10px; margin-top: 14px; }
  .pc { border: 1px solid var(--line); background: var(--raised); border-radius: 16px; padding: 12px 14px; }
  .pc.on { background: var(--card); }
  .pc .row { display: flex; align-items: center; gap: 10px; }
  .pc .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none;
            background: var(--card); color: var(--faint); }
  .pc.on .ic { background: color-mix(in srgb, var(--pc) 16%, transparent); color: var(--pc); }
  .pc.busy .ic { background: var(--pc); color: #fff; }
  .pc .ic svg { width: 19px; height: 19px; }
  .pc .nm { font-weight: 650; font-size: 14px; }
  .pc .st { font-size: 12px; color: var(--muted); }
  .pc .r { margin-left: auto; text-align: right; font-size: 13px; color: var(--muted); }
  .pc.busy .r { color: var(--pc); font-weight: 650; }
  .meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 10px; margin-top: 10px; }
  .meter { font-size: 12px; color: var(--muted); }
  .meter b { display: block; font: 600 15px var(--display); color: var(--ink); }
  .meter i { display: block; height: 5px; border-radius: 99px; background: var(--line); margin-top: 5px; overflow: hidden; }
  .meter i span { display: block; height: 100%; border-radius: 99px; background: var(--pc); }
  .meter i span.hot { background: var(--heat); }

  /* ---------- weather ---------- */
  .wx-now { display: grid; grid-template-columns: auto auto 1fr; gap: 14px; align-items: center; }
  .wx-big svg { width: 70px; height: 70px; display: block; }
  .wx-t { font: 400 50px/1 var(--display); letter-spacing: -.03em; }
  .wx-d { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .wx-side { font-size: 13px; color: var(--muted); display: grid; gap: 2px; justify-self: end; text-align: right; }
  .wx-side b { color: var(--ink); font-weight: 600; }
  .wx-hours { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(44px, 1fr); gap: 4px;
              margin: 16px 0 10px; overflow-x: auto; padding: 8px 4px; background: var(--raised); border-radius: 16px; }
  .wx-h { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; }
  .wx-ht { color: var(--muted); }
  .wx-i svg { width: 26px; height: 26px; display: block; }
  .wx-tt { font-weight: 600; }
  .wx-r { font-size: 11px; color: var(--faint); }
  .wx-r.wet { color: var(--sky); font-weight: 700; }
  .wx-days { display: grid; gap: 2px; padding-top: 4px; }
  .wx-day { display: grid; grid-template-columns: 52px 30px 1fr auto; align-items: center; gap: 8px; font-size: 14px; }
  .wx-day .lo { color: var(--muted); }
  @media (max-width: 420px) { .wx-now { grid-template-columns: auto 1fr; } .wx-side { grid-column: 1 / -1; justify-self: start; text-align: left; } }

  /* ---------- Echos ---------- */
  .echos { display: flex; flex-direction: column; }
  .echo { padding: 12px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .echo:first-child { border-top: 0; padding-top: 0; }
  .er { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .er .en { font-weight: 600; }
  .er .r { margin-left: auto; color: var(--muted); font-size: 13px; text-align: right; }
  .enext { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-left: 19px; }
  .enext svg, .chip svg, .vol svg, .np-ph svg { width: 15px; height: 15px; }
  .np { display: flex; align-items: center; gap: 10px; background: var(--raised); border-radius: 14px; padding: 8px; margin-left: 19px; }
  .np img, .np-ph { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; flex: none;
                    display: grid; place-items: center; background: var(--line); color: var(--muted); }
  .np-t { min-width: 0; flex: 1; }
  .np-1 { font-size: 14px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-2 { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-b { display: flex; gap: 4px; flex: none; }
  .np-b button { font-size: 14px; width: 34px; height: 34px; border-radius: 999px; border: 1px solid var(--line);
                 background: var(--card); color: var(--ink); cursor: pointer; padding: 0; }
  .ec { display: flex; align-items: center; gap: 10px; margin-left: 19px; flex-wrap: wrap; }
  .vol { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; flex: 1; min-width: 150px; }
  .vol input { flex: 1; accent-color: var(--echo); }
  .c-media .vol input { accent-color: var(--media); }
  .vol span { min-width: 22px; text-align: right; font-variant-numeric: tabular-nums; }
  .chip { font-size: 12px; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line);
          background: var(--card); color: var(--muted); border-radius: 999px; padding: 5px 11px; cursor: pointer; }
  .chip.on { background: #3b3f73; border-color: #3b3f73; color: #fff; }

  /* ---------- Ring doorbell ---------- */

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function clock(ts) { return new Date(ts * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}); }
function ago(ts) {
  if (!ts) return "";
  const m = Math.round((nowSec() - ts) / 60);
  if (m < 1) return "just now";
  if (m < 60) return `${m} min ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} h ago`;
  return new Date(ts * 1000).toLocaleDateString([], {weekday: "short", day: "numeric"});
}
function when(ts) {
  const d = new Date(ts * 1000);
  return d.toDateString() === new Date().toDateString() ? clock(ts)
    : d.toLocaleDateString([], {weekday: "short"}) + " " + clock(ts);
}
function lightWord(lux) {
  if (lux == null) return "";
  if (lux < 10) return "dark"; if (lux < 50) return "dim"; if (lux < 200) return "lit"; return "bright";
}
function fmt(t) { return t == null ? "–" : t.toFixed(1) + "°"; }

// ---------- PIN ----------
function showPin(error) {
  state.locked = true;
  $("app").innerHTML = `<div class="card pin"><div>Enter the PIN</div>
    <form onsubmit="sendPin(event)"><input id="pin" type="password" inputmode="numeric" autocomplete="off"><br>
    <button type="submit">Unlock</button></form></div>`;
  message(error || "", !!error);
  setTimeout(() => $("pin") && $("pin").focus(), 50);
}
async function sendPin(e) {
  e.preventDefault();
  const r = await fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({pin: $("pin").value})});
  const d = await r.json();
  if (d.ok) { state.locked = false; message(""); load(); } else showPin(d.error);
}

const MODES = [["auto", "Auto", "auto"], ["day", "Day", "sun"], ["night", "Night", "moon"], ["colour", "Colour", "palette"]];
function currentMode() { try { return localStorage.getItem("mh-theme") || "auto"; } catch (e) { return "auto"; } }
function setMode(m) {
  try { localStorage.setItem("mh-theme", m); } catch (e) {}
  if (m === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = m;
  drawModes();
}
function drawModes() {
  const cur = currentMode();
  $("modes").innerHTML = MODES.map(([key, label, icon]) =>
    `<button aria-pressed="${cur === key}" onclick="setMode('${key}')" title="${label}">${ICONS[icon]}<span>${label}</span></button>`).join("");
}

// ---------- hello, the time, and who's in ----------
function greeting() {
  const h = new Date().getHours();
  return h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
}
function drawHello() {
  const d = state.data, now = new Date();
  const people = (d && d.home && d.home.people) || [];
  const faces = people.map(p => {
    const word = p.home === null ? "" : p.home ? "Home" : "Out";
    const tip = p.since ? `${word} since ${when(p.since)}` : word;
    const far = !p.home && p.minutes != null ? `<small>${p.heading_home ? "on the way, " : ""}${p.minutes} min away</small>` : "";
    return `<div class="face ${p.home ? "in" : ""} ${p.heading_home ? "coming" : ""}" title="${esc(tip)}"><span class="av">${esc(p.name.slice(0, 1).toUpperCase())}</span>${esc(p.name)}${far}</div>`;
  }).join("");
  const home = people.filter(p => p.home).map(p => p.name);
  const line = !people.length ? "" : !home.length ? "Nobody's home right now"
    : home.length === people.length ? "Everyone's home" : `${home.join(" and ")} ${home.length === 1 ? "is" : "are"} home`;
  $("hello").innerHTML = `<div><h2>${greeting()}</h2>
      <div class="when2">${now.toLocaleDateString([], {weekday: "long", day: "numeric", month: "long"})}${line ? ". " + line + "." : ""}</div></div>
    ${faces ? `<div class="faces">${faces}</div>` : ""}
    <div class="clock">${now.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"})}</div>`;
}
// Click a card's title to fold it away; each phone or laptop remembers its own folded cards
function folded() { try { return new Set(JSON.parse(localStorage.getItem("mh-folded") || "[]")); } catch (e) { return new Set(); } }
function fold(key) {
  const f = folded();
  f.has(key) ? f.delete(key) : f.add(key);
  try { localStorage.setItem("mh-folded", JSON.stringify([...f])); } catch (e) {}
  applyFolds();
}
function applyFolds() {
  const f = folded();
  document.querySelectorAll(".head[data-key]").forEach(h => {
    const shut = f.has(h.dataset.key);
    h.parentElement.classList.toggle("folded", shut);
    h.querySelector(".fold").setAttribute("aria-expanded", String(!shut));
  });
}
const head = (key, icon, title, sub) => `<div class="head" data-key="${key}">
  <button class="fold" onclick="fold('${key}')" aria-expanded="true" title="Show or hide">
    <span class="bub">${ICONS[icon]}</span><span class="title">${title}</span>${ICONS.chev}</button>
  ${sub ? `<p class="sub">${sub}</p>` : ""}</div>`;

// ---------- layout: which cards go where. Each phone or laptop keeps its own ----------
const DEFAULT_LAYOUT = {left: ["lights", "media", "echo", "routines"], right: ["ring", "family", "weather", "pcs", "log"]};
function savedLayout() {
  try { const l = JSON.parse(localStorage.getItem("mh-layout") || "null"); if (l && l.left && l.right) return l; } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_LAYOUT));
}
function saveLayout(l) { try { localStorage.setItem("mh-layout", JSON.stringify(l)); } catch (e) {} }

function render() {
  const d = state.data;
  if (!d) return;
  const a = d.alexa;
  drawHello();
  const cards = {
    lights: `<div class="card c-lights">
          ${head("lights", "Light", "Lights and plugs", `${a.switches.filter(s => s.power === "ON").length} on`)}
          ${a.switches.length ? `<div class="grid">${a.switches.map(switchTile).join("")}</div>`
            : '<p class="empty">No lights or plugs found in Alexa yet.</p>'}
        </div>`,
    media: mediaCard(d.devices, d.casts),
    echo: `<div class="card c-echo">${head("echo", "echo", "Echos")}${echoList(a)}</div>`,
    routines: `<div class="card c-routines">
          ${head("routines", "spark", "Routines", "Tap to run")}
          ${a.routines.length ? `<div class="routines">${a.routines.map(r =>
            `<button onclick='runRoutine(${JSON.stringify(r).replace(/'/g, "&#39;")})'>${esc(r.replace(/^alexa,\s*/i, ""))}</button>`).join("")}</div>`
            : '<p class="empty">No routines found.</p>'}
        </div>`,
    ring: ringCard(d.ring),
    family: familyCard(d.family),
    weather: weatherCard(d.weather),
    pcs: homeCard(d.home),
    log: `<div class="card c-log">${head("log", "history", "Recent changes")}${logList(d.log)}</div>`,
  };
  const layout = savedLayout();
  // Any card this device hasn't placed yet goes where it normally lives
  Object.keys(cards).forEach(k => {
    if (!layout.left.includes(k) && !layout.right.includes(k))
      (DEFAULT_LAYOUT.left.includes(k) ? layout.left : layout.right).push(k);
  });
  const col = keys => keys.map(k => cards[k] || "").join("");
  $("app").innerHTML = `
    <div class="tiles">${heatingTile(d.heating)}${raceTile(d.race)}${d.ring ? ringTile(d.ring) + doorTiles(a.sensors.filter(s => s.kind === "SECURITY_PANEL"), 1) : doorTiles(a.sensors, 2)}</div>
    ${state.arranging ? `<div class="arrange-bar">Use ↑ ↓ to move a card, ⇄ to send it to the other column.
      <button onclick="resetLayout()">Reset layout</button><button class="done" onclick="arrange(false)">Done</button></div>` : ""}
    <div class="layout ${state.arranging ? "arranging" : ""}">
      <div class="col" data-col="left">${col(layout.left)}</div>
      <div class="col" data-col="right">${col(layout.right)}</div>
    </div>`;
  applyFolds();
  if (state.arranging) addMoveButtons();
  placeMap(d.family);
  if (a.error) message("Alexa: " + a.error, true);
}

function arrange(on) { state.arranging = on; $("arrange-btn").setAttribute("aria-pressed", String(on)); render(); }
function resetLayout() { try { localStorage.removeItem("mh-layout"); } catch (e) {} render(); }
function addMoveButtons() {
  document.querySelectorAll(".layout .col .card > .head[data-key]").forEach(h => {
    const key = h.dataset.key;
    const box = document.createElement("span");
    box.className = "mover";
    box.innerHTML = `<button onclick="moveCard('${key}', -1)" aria-label="Move up">↑</button>
      <button onclick="moveCard('${key}', 1)" aria-label="Move down">↓</button>
      <button onclick="moveCard('${key}', 0)" aria-label="Move to the other column">⇄</button>`;
    h.appendChild(box);
  });
}
function moveCard(key, step) {
  const l = savedLayout();
  // Only the cards actually on the page count, so a hidden card doesn't swallow a move
  const shown = new Set([...document.querySelectorAll(".layout .card > .head[data-key]")].map(h => h.dataset.key));
  const side = l.left.includes(key) ? "left" : "right";
  const list = l[side].filter(k => shown.has(k) || k === key);
  const rest = l[side].filter(k => !list.includes(k));
  const i = list.indexOf(key);
  if (step === 0) {
    list.splice(i, 1);
    const other = side === "left" ? "right" : "left";
    l[other] = [key, ...l[other].filter(k => k !== key)];
  } else {
    const j = i + step;
    if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
  }
  l[side] = [...list, ...rest];
  saveLayout(l);
  render();
}

function heatingTile(h) {
  if (!h || !h.running) return `<a class="tile t-heat" href="${esc(h && h.link)}" target="_blank" rel="noopener" onclick="return openWindow(this.href, 'mobys-heat')">
    <div class="k"><span class="bub">${ICONS.flame}</span>Heating</div><div class="v">–</div><div class="s">Moby's Heat isn't answering</div></a>`;
  if (h.error || h.room == null) return `<a class="tile t-heat" href="${esc(h.link)}" target="_blank" rel="noopener" onclick="return openWindow(this.href, 'mobys-heat')">
    <div class="k"><span class="bub">${ICONS.flame}</span>Heating</div><div class="v">–</div>
    <div class="s">${h.error === "PIN needed" ? "Add Moby's Heat's PIN to home_config.ini" : esc(h.error || "No reading yet")}</div></a>`;
  let mode = h.mode || "";
  if (h.boost_ends) {
    const mins = Math.max(0, Math.ceil((h.boost_ends - nowSec()) / 60));
    mode = `Boost · ${mins} min left`;
  }
  return `<a class="tile t-heat" href="${esc(h.link)}" target="_blank" rel="noopener" onclick="return openWindow(this.href, 'mobys-heat')">
    <div class="k"><span class="bub">${ICONS.flame}</span>Heating</div>
    <div class="v">${fmt(h.room)}</div>
    <div class="s">Set ${fmt(h.target)} · ${esc(mode)}${h.outside != null ? ` · ${fmt(h.outside)} out` : ""}</div></a>`;
}

// At home (opened as http://pc-name:port) go straight to the race dashboard on the same PC,
// which lets home Wi-Fi in without a code. Through a web address, use its web address.
function raceLink(r) {
  return location.protocol === "http:" ? `http://${location.hostname}:${r.port || 8080}` : r.link;
}

function raceTile(r) {
  return `<a class="tile t-race" href="${esc(raceLink(r))}" target="_blank" rel="noopener" onclick="return openWindow(this.href, 'race-dashboard')">
    <div class="k"><span class="bub">${ICONS.flag}</span>Race dashboard</div>
    <div class="v word"><span class="dot ${r.running ? "ok" : ""}"></span>
      ${r.running ? "Running" : "Not running"}</div>
    <div class="s">Open the pit wall</div></a>`;
}

function doorTiles(sensors, count) {
  const shown = sensors.slice(0, count);
  while (shown.length < count) shown.push(null);
  return shown.map(s => {
    if (!s) return `<div class="tile t-door" style="padding:16px 18px"><div class="k"><span class="bub">${ICONS.door}</span>Front door</div>
      <div class="v">–</div><div class="s">No door sensors found</div></div>`;
    const icon = s.kind === "SECURITY_PANEL" ? ICONS.shield : ICONS.door;
    let big, small;
    if (s.motion) {
      const moving = s.motion === "DETECTED";
      big = `<span class="dot ${moving ? "alert" : "ok"}"></span> ${moving ? "Motion" : "All quiet"}`;
      small = s.motion_changed ? `${moving ? "Since" : "Last motion"} ${ago(s.motion_changed)}` : "";
    } else {
      big = `<span class="dot ${s.reachable ? "ok" : "bad"}"></span> ${s.reachable ? "Connected" : "Not responding"}`;
      small = s.maker;
    }
    return `<div class="tile ${s.kind === "SECURITY_PANEL" ? "t-alarm" : "t-door"}" style="padding:16px 18px"><div class="k"><span class="bub">${icon}</span>${esc(s.name)}</div>
      <div class="v word">${big}</div><div class="s">${esc(small)}</div></div>`;
  }).join("");
}

function switchTile(s) {
  const on = s.power === "ON";
  const off = !s.reachable;
  const busy = state.busy[s.id];
  const status = off ? "Not responding" : busy ? "Changing…"
    : on ? (s.brightness != null && s.can_dim ? `On · ${s.brightness}%` : "On") : "Off";
  const slider = on && s.can_dim && !off
    ? `<input type="range" min="1" max="100" value="${s.brightness ?? 100}" aria-label="Brightness"
         onclick="event.stopPropagation()" onchange="setBrightness('${s.id}', this.value)">` : "";
  // Colour lights always show their colours; picking one switches the light on in that colour
  const swatches = !off && (s.can_colour || s.can_white) ? `<span class="sws">
      ${s.can_white ? WHITES.map(([k, c, label]) => swatch(s.id, `setWhite('${s.id}', ${k})`, c, label)).join("") : ""}
      ${s.can_colour ? COLOURS.map(([h, label]) => swatch(s.id, `setColour('${s.id}', ${h})`, `hsl(${h} 90% 56%)`, label)).join("") : ""}
    </span>` : "";
  // A coloured light glows in its own colour
  const tint = on && s.hue != null ? ` style="--lamp: hsl(${s.hue} 90% 58%)"` : "";
  return `<button class="sw ${on && !off ? "on" : ""} ${off ? "off-line" : ""} ${busy ? "busy" : ""} ${swatches ? "wide" : ""}"
      ${off ? "disabled" : ""} onclick="toggle('${s.id}')" aria-pressed="${on}"${tint}>
    <span class="ic">${ICONS[s.label] || ICONS.Switch}</span>
    <span class="nm">${esc(s.name)}</span>${slider}${swatches}<span class="st">${status}</span></button>`;
}

const WHITES = [[2700, "#ffc070", "Warm white"], [4000, "#ffe6bf", "Natural white"], [6500, "#e6efff", "Cool white"]];
const COLOURS = [[0, "Red"], [28, "Orange"], [52, "Yellow"], [120, "Green"], [175, "Teal"], [220, "Blue"], [272, "Purple"], [320, "Pink"]];
function swatch(id, action, colour, label) {
  return `<span class="swatch" role="button" tabindex="0" title="${label}" aria-label="${label}" style="background:${colour}"
    onclick="event.stopPropagation(); ${action}" onkeydown="if (event.key === 'Enter') { event.stopPropagation(); ${action} }"></span>`;
}
async function lightChange(id, body, what) {
  state.busy[id] = true; render();
  try { apply(await post("/api/switch", Object.assign({id}, body))); message(""); }
  catch (e) { if (e.message !== "PIN needed") message(e.message, true); }
  finally { delete state.busy[id]; render(); }
}
const setColour = (id, hue) => lightChange(id, {hue, saturation: 1});
const setWhite = (id, kelvin) => lightChange(id, {kelvin});

function mediaCard(dev, casts) {
  dev = dev || {};
  casts = casts || [];
  if (!Object.keys(dev).length && !casts.length) return "";
  const parts = [];
  if (dev.tv) parts.push(tvTile(dev.tv));
  if (dev.ps5) parts.push(consoleTile(dev.ps5, {on: "On", rest: "Rest mode", off: "Off"}));
  if (dev.xbox) parts.push(consoleTile(dev.xbox, {on: "On", asleep: "Asleep", off: "Off"}));
  return `<div class="card c-media">${head("media", "tv", "TV and consoles")}
    ${parts.length ? `<div class="media">${parts.join("")}</div>` : ""}
    ${casts.length ? `<div class="casts">${casts.map(castTile).join("")}</div>` : ""}</div>`;
}

function castTile(c) {
  const live = c.online && c.state !== "idle";
  const words = !c.online ? "Not connected" : c.state === "idle" ? "Nothing casting"
    : `${c.state === "paused" ? "Paused" : "Casting"} · ${esc(c.app)}`;
  const media = live && c.title ? `<div class="np cnp">
      ${c.art ? `<img src="${esc(c.art)}" alt="" loading="lazy">` : `<span class="np-ph">${ICONS.music}</span>`}
      <div class="np-t"><div class="np-1">${esc(c.title)}</div><div class="np-2">${esc(c.subtitle || c.app)}</div></div>
      <div class="np-b">
        ${c.can_pause ? `<button onclick="cast('${c.id}', '${c.state === "playing" ? "pause" : "play"}')"
          aria-label="${c.state === "playing" ? "Pause" : "Play"}">${c.state === "playing" ? "⏸" : "▶"}</button>` : ""}
        <button onclick="cast('${c.id}', 'stop')" aria-label="Stop casting" title="Stop casting">⏹</button>
      </div></div>`
    : live ? `<div class="ctrls"><button onclick="cast('${c.id}', 'stop')">Stop casting</button></div>` : "";
  const vol = c.online && c.volume != null ? `<span class="vol">${ICONS.speaker}<input type="range" min="0" max="100"
      value="${c.volume}" aria-label="Volume" onchange="cast('${c.id}', 'volume', +this.value)"><span>${c.volume}</span></span>` : "";
  return `<div class="dev ${live ? "live" : ""}">
    <div class="top"><span class="ic">${ICONS.cast}</span><div><div class="nm">${esc(c.name)}</div>
      <div class="st">${words}</div></div></div>${media}${vol}</div>`;
}

async function cast(id, action, value) {
  try { apply(await post("/api/cast", {id, action, value})); message(""); }
  catch (e) { if (e.message !== "PIN needed") message(e.message, true); }
}

function tvTile(t) {
  const on = t.state === "on";
  const words = {on: "On", standby: "Standby", off: "Off"};
  const apps = on && t.apps.length ? `<div class="apps">${t.apps.slice(0, 8).map(a =>
      `<button onclick='tv("app", ${JSON.stringify(a.id)}, ${JSON.stringify(a.name).replace(/'/g, "&#39;")})'>${esc(a.name)}</button>`).join("")}</div>` : "";
  const ctrls = on
    ? `<div class="ctrls"><button class="pw" onclick="tv('power_off')">Turn off</button>
        <button onclick="tv('volume_down')" aria-label="Volume down">Vol −</button>
        <button onclick="tv('volume_up')" aria-label="Volume up">Vol +</button>
        <button onclick="tv('mute')">Mute</button></div>`
    : `<div class="ctrls"><button class="pw" onclick="tv('power_on')">Turn on</button></div>`;
  return `<div class="dev tv ${on ? "live" : ""}">
    <div class="top"><span class="ic">${ICONS.tv}</span><div><div class="nm">${esc(t.label)}</div>
      <div class="st">${words[t.state] || t.state}${on && t.watching ? " · " + esc(t.watching) : t.model ? " · " + esc(t.model) : ""}</div></div></div>
    ${ctrls}${apps}
    ${t.needs_allow ? '<div class="hint">Look at the TV and choose Allow, then try again.</div>' : ""}</div>`;
}

function consoleTile(c, words) {
  const on = c.state === "on";
  return `<div class="dev ${on ? "live" : ""}">
    <div class="top"><span class="ic">${ICONS.pad}</span><div><div class="nm">${esc(c.label)}</div>
      <div class="st">${words[c.state] || c.state}</div></div></div>
    ${on && c.game ? `<div class="playing">${c.game_icon ? `<img src="${esc(c.game_icon)}" alt="" loading="lazy">` : ""}
      <div><div class="st">Playing</div><div class="game" title="${esc(c.game)}">${esc(c.game)}</div></div></div>` : ""}
    ${c.psn_warning ? `<div class="hint">${esc(c.psn_warning)}</div>` : ""}</div>`;
}

async function tv(action, appId, appName) {
  message(action === "power_on" ? "Waking the TV…" : "Sending to the TV…");
  try { apply(await post("/api/tv", {action, app_id: appId, app_name: appName})); message(""); }
  catch (e) { if (e.message !== "PIN needed") message(e.message, true); }
}

function echoList(a) {
  if (!a.echos.length) return '<p class="empty">No Echos found.</p>';
  const light = {};
  a.rooms.forEach(r => light[r.name] = r);
  return `<div class="echos">${a.echos.map(e => {
    const room = light[e.name];
    const bits = [];
    if (room && room.lux != null) bits.push(`${lightWord(room.lux)} (${Math.round(room.lux)} lux)`);
    if (room && room.temperature != null) bits.push(fmt(room.temperature));
    if (!e.online) bits.push("offline");
    if (e.dnd) bits.push("Do Not Disturb");
    const next = e.next ? nextText(e.next) : "";
    const media = e.online && e.has_media ? `<div class="np">
        ${e.art ? `<img src="${esc(e.art)}" alt="" loading="lazy">` : `<span class="np-ph">${ICONS.music}</span>`}
        <div class="np-t"><div class="np-1">${esc(e.title || "")}</div><div class="np-2">${esc(e.subtitle || "")}</div></div>
        <div class="np-b">
          <button onclick="echo('${e.serial}', 'previous')" aria-label="Previous">⏮</button>
          <button onclick="echo('${e.serial}', '${e.playing ? "pause" : "play"}')" aria-label="${e.playing ? "Pause" : "Play"}">${e.playing ? "⏸" : "▶"}</button>
          <button onclick="echo('${e.serial}', 'next')" aria-label="Next">⏭</button>
        </div></div>` : "";
    const controls = e.online && e.volume != null ? `<div class="ec">
        <span class="vol">${ICONS.speaker}<input type="range" min="0" max="100" value="${e.volume}"
          aria-label="Volume" onchange="echo('${e.serial}', 'volume', +this.value)"><span>${e.volume}</span></span>
        ${e.dnd != null ? `<button class="chip ${e.dnd ? "on" : ""}" onclick="echo('${e.serial}', 'dnd', ${!e.dnd})"
          title="Do Not Disturb">${ICONS.moon} ${e.dnd ? "DND on" : "DND"}</button>` : ""}</div>` : "";
    return `<div class="echo">
      <div class="er"><span class="dot ${e.online ? "ok" : ""}"></span><span class="en">${esc(e.name)}</span>
        <span class="r">${esc(bits.join(" · ") || e.model || "")}</span></div>
      ${next ? `<div class="enext">${next}</div>` : ""}${media}${controls}</div>`;
  }).join("")}</div>`;
}

function nextText(n) {
  const mins = Math.round((n.at - nowSec()) / 60);
  if (n.kind.toLowerCase().includes("timer")) {
    const left = mins >= 60 ? `${Math.floor(mins / 60)} h ${mins % 60} min` : `${Math.max(0, mins)} min`;
    return `${ICONS.timer} Timer${n.label ? " " + esc(n.label) : ""}: ${left} left`;
  }
  const kind = n.kind.toLowerCase().includes("reminder") ? "Reminder" : "Alarm";
  return `${ICONS.bell} ${kind} ${when(n.at)}${n.label ? " · " + esc(n.label) : ""}`;
}

async function echo(serial, action, value) {
  try { apply(await post("/api/echo", {serial, action, value})); message(""); }
  catch (e) { if (e.message !== "PIN needed") message(e.message, true); }
}

// ---------- Ring doorbell ----------
function ringTile(r) {
  const pressedLately = r.last_press && nowSec() - r.last_press < 600;
  const big = r.live && r.live.kind === "press" ? `<span class="dot alert"></span> At the door`
    : pressedLately ? `<span class="dot alert"></span> Pressed ${ago(r.last_press)}`
    : `<span class="dot ok"></span> All quiet`;
  const small = [r.battery != null ? `Battery ${r.battery}%` : "", `${r.presses} press${r.presses === 1 ? "" : "es"} today`].filter(Boolean).join(" · ");
  return `<div class="tile t-door" style="padding:16px 18px"><div class="k"><span class="bub">${ICONS.bell}</span>${esc(r.name || "Front door")}</div>
    <div class="v word">${big}</div><div class="s">${small}</div></div>`;
}

function ringCard(r) {
  if (!r) return "";
  const hours = [0, 6, 12, 18, 24];
  const day0 = new Date(); day0.setHours(0, 0, 0, 0);
  const marks = (r.timeline || []).map(e => {
    const pct = Math.min(100, Math.max(0, (e.ts * 1000 - day0) / 864000));
    return `<i class="mark ${e.kind}" style="left:${pct}%" title="${e.kind === "press" ? "Doorbell pressed" : "Motion"} ${clock(e.ts)}"></i>`;
  }).join("");
  const nowPct = (Date.now() - day0) / 864000;
  const battery = r.battery != null ? `<div class="meter">Battery<b>${r.battery}%</b><i><span class="${r.battery <= 20 ? "hot" : ""}" style="width:${r.battery}%"></span></i></div>` : "";
  const quiet = r.quiet_until
    ? `<button class="chip on" onclick="ring('quiet_off')">${ICONS.moon} Quiet until ${clock(r.quiet_until)}</button>`
    : `<button class="chip" onclick="ring('quiet_on')" title="Do Not Disturb on every Echo for an hour">${ICONS.moon} Quiet hour</button>`;
  const motion = r.motion_on === false
    ? `<button class="chip" onclick="ring('motion_on')">Motion alerts off</button>`
    : `<button class="chip on-ok" onclick="ring('motion_off')">Motion alerts on</button>`;
  return `<div class="card c-door">${head("ring", "bell", esc(r.name || "Front door"), r.error ? esc(r.error) : "")}
    <div class="ring-top">
      <div class="meter">Last press<b>${r.last_press ? ago(r.last_press) : "–"}</b></div>
      <div class="meter">Last motion<b>${r.last_motion ? ago(r.last_motion) : "–"}</b></div>
      ${battery}
    </div>
    <div class="day">
      <div class="day-bar">${marks}<i class="now" style="left:${nowPct}%"></i></div>
      <div class="day-hours">${hours.map(h => `<span>${String(h).padStart(2, "0")}</span>`).join("")}</div>
      <div class="day-key"><span><i class="mark press"></i> ${r.presses} press${r.presses === 1 ? "" : "es"}</span>
        <span><i class="mark motion"></i> ${r.motions} motion</span></div>
    </div>
    <div class="ring-ctrls"><button class="chip live-btn" onclick="openLiveView()">${ICONS.video} Live view</button>${motion}${quiet}</div></div>`;
}

async function ring(action) {
  try { apply(await post("/api/ring", {action})); message(""); }
  catch (e) { if (e.message !== "PIN needed") message(e.message, true); }
}

// A soft two-note chime, made in the browser, so there's no sound file to load
function chime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [[659, 0], [523, 0.45]].forEach(([freq, at]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + at);
      g.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + at + 1.2);
      o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + at); o.stop(ctx.currentTime + at + 1.3);
    });
  } catch (e) {}
}

function showDoorBanner(ts) {
  let b = $("door-banner");
  if (!b) { b = document.createElement("div"); b.id = "door-banner"; document.body.appendChild(b); }
  b.innerHTML = `<span class="db-ic">${ICONS.bell}</span><div><b>Someone's at the front door</b><span>Pressed at ${clock(ts)}</span></div>
    <button class="db-live" onclick="this.parentElement.remove(); openLiveView()">Live view</button>
    <button onclick="this.parentElement.remove()">OK</button>`;
  b.className = "";
  requestAnimationFrame(() => requestAnimationFrame(() => b.className = "show"));
  clearTimeout(showDoorBanner.timer);
  showDoorBanner.timer = setTimeout(() => b.remove(), 120000);
}

// Ask every few seconds whether the doorbell has gone, so the banner is near-instant
const ringWatch = { last: null };
async function watchDoor() {
  if (state.locked || !state.data || !state.data.ring) return;
  try {
    const r = await (await fetch("/api/ring/live")).json();
    const live = r.live;
    if (live && ringWatch.last !== null && live.id !== ringWatch.last) {
      if (live.kind === "press") { showDoorBanner(live.ts); chime(); }
      load();
    }
    ringWatch.last = live ? live.id : 0;
  } catch (e) {}
}

// ---------- live view: the browser talks video straight to Ring; the dashboard only passes messages ----------
const lv = {};
const viewPost = body => fetch("/api/ring/view", {method: "POST", headers: {"Content-Type": "application/json"},
  body: JSON.stringify(body)}).then(r => r.json());

async function openLiveView() {
  closeLiveView();
  const box = document.createElement("div");
  box.id = "liveview";
  box.innerHTML = `<div class="lv-card" role="dialog" aria-label="Front door live view">
    <div class="lv-head"><span class="lv-badge"><i></i>LIVE</span><b>${esc((state.data.ring && state.data.ring.name) || "Front door")}</b>
      <span class="lv-left" id="lv-left"></span><button class="lv-x" onclick="closeLiveView()" aria-label="Close">✕</button></div>
    <div class="lv-video"><video id="lv-video" autoplay playsinline muted></video><div class="lv-msg" id="lv-msg">Waking the doorbell…</div></div>
    <div class="lv-foot"><button onclick="lvSound(this)">${ICONS.speaker} Sound on</button>
      <button onclick="lvPicture()">${ICONS.camera} Take picture</button><span id="lv-shot"></span></div></div>`;
  box.addEventListener("click", e => { if (e.target === box) closeLiveView(); });
  document.body.appendChild(box);
  try {
    const pc = new RTCPeerConnection({iceServers: [{urls: "stun:stun.l.google.com:19302"}]});
    lv.pc = pc; lv.pending = []; lv.id = null;
    pc.addTransceiver("video", {direction: "recvonly"});
    pc.addTransceiver("audio", {direction: "recvonly"});
    pc.ontrack = e => { const v = $("lv-video"); if (v && !v.srcObject) v.srcObject = e.streams[0]; };
    pc.onicecandidate = e => {
      if (!e.candidate) return;
      const c = {candidate: e.candidate.candidate, index: e.candidate.sdpMLineIndex};
      lv.id ? viewPost({step: "candidate", id: lv.id, ...c}) : lv.pending.push(c);
    };
    pc.onconnectionstatechange = () => {
      if (["failed", "closed"].includes(pc.connectionState)) lvSay("The live view dropped. Close and try again.");
    };
    $("lv-video").onplaying = () => lvSay("");
    await pc.setLocalDescription(await pc.createOffer());
    const r = await viewPost({step: "start", offer: pc.localDescription.sdp});
    if (!r.ok) throw new Error(r.error);
    lv.id = r.id;
    await pc.setRemoteDescription({type: "answer", sdp: r.answer});
    lv.pending.forEach(c => viewPost({step: "candidate", id: lv.id, ...c}));
    lv.ends = Date.now() + r.max_seconds * 1000;
    lv.poll = setInterval(async () => {
      if (!lv.id) return;
      const m = await viewPost({step: "messages", id: lv.id});
      (m.candidates || []).forEach(c => pc.addIceCandidate({candidate: c.candidate, sdpMLineIndex: c.index}).catch(() => {}));
      if (m.closed) { lvSay("The doorbell ended the live view."); clearInterval(lv.poll); }
    }, 1000);
    lv.keep = setInterval(() => lv.id && viewPost({step: "keep_alive", id: lv.id}), 20000);
    lv.tick = setInterval(() => {
      const left = Math.max(0, Math.round((lv.ends - Date.now()) / 1000));
      const el = $("lv-left"); if (el) el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")} left`;
      if (!left) closeLiveView();
    }, 1000);
  } catch (e) {
    lvSay("Couldn't start the live view: " + (e.message || e));
  }
}
function lvSay(text) { const m = $("lv-msg"); if (m) { m.textContent = text; m.style.display = text ? "" : "none"; } }
function lvSound(btn) {
  const v = $("lv-video"); if (!v) return;
  v.muted = !v.muted; btn.innerHTML = `${ICONS.speaker} ${v.muted ? "Sound on" : "Sound off"}`;
}
function lvPicture() {
  const v = $("lv-video");
  if (!v || !v.videoWidth) return;
  const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0);
  const url = c.toDataURL("image/jpeg", 0.9);
  const name = `front-door-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-")}.jpg`;
  $("lv-shot").innerHTML = `<a href="${url}" download="${name}"><img src="${url}" alt="Picture just taken">Save picture</a>`;
}
function closeLiveView() {
  ["poll", "keep", "tick"].forEach(k => clearInterval(lv[k]));
  if (lv.id) viewPost({step: "stop", id: lv.id});
  if (lv.pc) try { lv.pc.close(); } catch (e) {}
  Object.keys(lv).forEach(k => delete lv[k]);
  const box = $("liveview"); if (box) box.remove();
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLiveView(); });

// ---------- family map (Google location sharing) ----------
const FAMILY_COLOURS = ["#2e8bff", "#e8364f", "#16a873", "#7b61ff", "#ffaa1d", "#0fa9bd"];
const fam = { map: null, el: null, markers: {}, home: null, fitted: "" };

function familyCard(f) {
  if (!f) return "";
  const rows = f.people.map((p, i) => {
    const colour = FAMILY_COLOURS[i % FAMILY_COLOURS.length];
    const where = p.home ? "Home" : `${p.heading_home ? "On the way home · " : ""}${p.minutes} min from home · ${p.km} km`;
    const bits = [p.place && !p.home ? esc(p.place) : "", p.seen ? `seen ${ago(p.seen)}` : "",
      p.battery != null ? `battery ${p.battery}%${p.charging ? " (charging)" : ""}` : ""].filter(Boolean).join(" · ");
    return `<li onclick="focusPerson('${esc(p.name)}')"><span class="fam-dot" style="background:${colour}">${esc(p.name.slice(0, 1))}</span>
      <div><div class="nm">${esc(p.name)} <span class="where ${p.home ? "home" : p.heading_home ? "coming" : ""}">${where}</span></div>
      <div class="st">${bits}</div></div></li>`;
  }).join("");
  return `<div class="card c-family">${head("family", "pin", "Family", f.error ? esc(f.error) : `<button class="chip" onclick="showEveryone()">Show everyone</button>`)}
    <div id="famap-slot" class="famap"></div>
    ${rows ? `<ul class="fam">${rows}</ul>` : '<p class="empty">Waiting for the first locations…</p>'}</div>`;

function loadLeaflet() {
  if (window.L || loadLeaflet.loading) return loadLeaflet.loading;
  const css = document.createElement("link");
  css.rel = "stylesheet"; css.href = "/static/leaflet.css";   // Leaflet 1.9.4, kept with Moby's Home
  document.head.appendChild(css);
  loadLeaflet.loading = new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = "/static/leaflet.js";
    s.onload = ok; s.onerror = fail; document.head.appendChild(s);
  });
  return loadLeaflet.loading;
}

// The map is made once and moved into each fresh copy of the card, so it doesn't flicker or reset
async function placeMap(f) {
  const slot = $("famap-slot");
  if (!f || !slot || !f.home) return;
  try { await loadLeaflet(); } catch (e) { slot.textContent = "The map couldn't load."; return; }
  if (!fam.el) {
    fam.el = document.createElement("div"); fam.el.className = "famap-inner";
    slot.appendChild(fam.el);
    fam.map = L.map(fam.el, {zoomControl: true, attributionControl: true, scrollWheelZoom: false});
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {maxZoom: 18, attribution: "© OpenStreetMap"}).addTo(fam.map);
    fam.home = L.marker([f.home.lat, f.home.lon], {icon: L.divIcon({className: "home-pin",
      html: ICONS.homepin, iconSize: [34, 34], iconAnchor: [17, 17]}), zIndexOffset: -1000}).addTo(fam.map);   // people sit on top of home
  } else {
    slot.appendChild(fam.el);
  }
  f.people.forEach((p, i) => {
    const colour = FAMILY_COLOURS[i % FAMILY_COLOURS.length];
    const icon = L.divIcon({className: "fam-pin", iconSize: [34, 34], iconAnchor: [17, 17],
      html: `<span style="background:${colour}">${esc(p.name.slice(0, 1))}</span>`});
    if (!fam.markers[p.name]) fam.markers[p.name] = L.marker([p.lat, p.lon], {icon}).addTo(fam.map);
    else fam.markers[p.name].setLatLng([p.lat, p.lon]).setIcon(icon);
    fam.markers[p.name].bindTooltip(`${esc(p.name)}: ${p.home ? "home" : p.minutes + " min from home"}`);
  });
  fam.map.invalidateSize();
  // Re-fit the map when someone appears or moves a fair way, so nobody ends up off the edge
  const sig = f.people.map(p => `${p.name}:${p.lat.toFixed(2)},${p.lon.toFixed(2)}`).join("|");
  if (sig !== fam.fitted) { showEveryone(f); fam.fitted = sig; }
}
function showEveryone(f) {
  f = f || (state.data && state.data.family);
  if (!f || !fam.map || !f.home) return;
  const pts = [[f.home.lat, f.home.lon], ...f.people.map(p => [p.lat, p.lon])];
  fam.map.fitBounds(pts, {padding: [40, 40], maxZoom: 15});
}
function focusPerson(name) {
  const m = fam.markers[name];
  if (m && fam.map) { fam.map.setView(m.getLatLng(), 15); m.openTooltip(); }
}

function pcIcon(name) {

}
function uptime(secs) {
  const d = Math.floor(secs / 86400), h = Math.floor(secs % 86400 / 3600), m = Math.floor(secs % 3600 / 60);
  return d ? `${d} d ${h} h` : h ? `${h} h ${m} min` : `${m} min`;
}
function meter(label, value, pct, hotAt) {
  return `<div class="meter">${label}<b>${value}</b><i><span class="${pct >= hotAt ? "hot" : ""}" style="width:${Math.min(100, Math.max(2, pct))}%"></span></i></div>`;
}
function homeCard(h) {
  if (!h || !h.computers.length) return "";
  const pcs = h.computers.map(c => {
    const on = c.on, s = c.stats;
    const word = on === null ? "Checking…" : !on ? (c.last_seen ? `Off · last seen ${ago(c.last_seen)}` : "Off")
      : c.busy ? `Busy · ${c.mbps} Mbit/s` : c.mbps != null ? `On · ${c.mbps} Mbit/s` : "On";
    const bits = on ? [c.link, c.ip].filter(Boolean).join(" · ") : "";
    const meters = on && s ? `<div class="meters">
        ${meter("Processor", s.cpu + "%", s.cpu, 80)}
        ${meter("Memory", s.memory + "%", s.memory, 85)}
        ${meter("Disk free", s.disk_free_gb + " GB", s.disk_used, 90)}
        ${s.temp != null ? meter("Temperature", Math.round(s.temp) + "°C", s.temp, 70) : ""}
      </div><div class="st" style="margin-top:8px">${s.here ? "Runs Moby's Home · " : ""}On for ${uptime(s.uptime)}</div>` : "";
    return `<div class="pc ${on ? "on" : ""} ${c.busy ? "busy" : ""}"><div class="row"><span class="ic">${pcIcon(c.name)}</span>
      <div><div class="nm">${esc(c.name)}</div><div class="st">${esc(bits)}</div></div>
      <span class="r">${word}</span></div>${meters}</div>`;
  }).join("");
  return `<div class="card c-pcs">${head("pcs", "laptop", "Computers", h.error ? esc(h.error) : "")}<div class="pcs" style="margin-top:0">${pcs}</div></div>`;
}

// Open a dashboard in its own window, or bring it to the front if it's already open
function openWindow(url, name) {

// ---------- actions ----------
function message(text, err) { $("msg").textContent = text; $("msg").className = "msg" + (err ? " err" : ""); }
function stamp() {
  const t = state.data && state.data.alexa.updated;
  $("updated").textContent = t ? "Alexa checked " + clock(t) : "";
}

async function getJSON(url, opts) {
  const r = await fetch(url, opts);
  const d = await r.json();
  if (d.need_pin) { showPin(); throw new Error("PIN needed"); }
  if (!d.ok) throw new Error(d.error);
  return d;
}
const post = (url, body) => getJSON(url, {method: "POST", headers: {"Content-Type": "application/json"},
                                         body: JSON.stringify(body || {})});

function apply(d) {
  state.data = d;
  // Remember the doorbell's latest press on first load, so only new presses pop up
  if (ringWatch.last === null && d.ring) ringWatch.last = d.ring.live ? d.ring.live.id : 0;
  state.skew = d.now - Date.now() / 1000;
  render(); stamp();
}

async function toggle(id) {
  const s = state.data.alexa.switches.find(x => x.id === id);
  if (!s || state.busy[id]) return;
  const turnOn = s.power !== "ON";
  state.busy[id] = true; render();
  try { apply(await post("/api/switch", {id, on: turnOn})); message(""); }
  catch (e) { if (e.message !== "PIN needed") message(e.message, true); }
  finally { delete state.busy[id]; render(); }
}

async function setBrightness(id, value) {
  state.busy[id] = true; render();
  try { apply(await post("/api/switch", {id, brightness: +value})); message(""); }
  catch (e) { if (e.message !== "PIN needed") message(e.message, true); }
  finally { delete state.busy[id]; render(); }
}

async function runRoutine(name) {
  if (!confirm(`Run "${name.replace(/^alexa,\s*/i, "")}"?`)) return;
  message(`Running ${name}…`);
  try { apply(await post("/api/routine", {name})); message(`Ran ${name}`); }
  catch (e) { if (e.message !== "PIN needed") message(e.message, true); }
}

async function refreshNow() {
  message("Asking Alexa…");
  try { apply(await post("/api/refresh")); message(""); }
  catch (e) { if (e.message !== "PIN needed") message(e.message, true); }
}

async function load() {
  try {
    const d = await getJSON("/api/status");
    if (!Object.keys(state.busy).length) apply(d);
    if (!$("msg").classList.contains("err") || !d.alexa.error) message("");
  } catch (e) {
    if (e.message !== "PIN needed") message("Can't reach Moby's Home: " + e.message, true);
  }
}

drawModes();
load();
setInterval(() => { if (!state.locked) load(); }, 20000);
setInterval(() => { if (state.data) drawHello(); }, 30000);   // keep the clock and greeting current
setInterval(watchDoor, 3000);
</script>
</body>
</html>
