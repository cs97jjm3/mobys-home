<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moby's Home demo</title>
<meta name="theme-color" content="#1c5cab">
<meta name="apple-mobile-web-app-title" content="Moby's Home">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="static/manifest.webmanifest">
<link rel="icon" href="static/favicon.svg" type="image/svg+xml">
<link rel="icon" href="static/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="static/apple-touch-icon.png">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f1ec; --card: #ffffff; --ink: #1d1b19; --muted: #6f6a64; --faint: #9a948c;
    --line: #e9e4dd; --soft: #f6f3ee;
    --on: #eda100; --on-soft: #fdf1d6; --on-ink: #7a5300;
    --blue: #2a78d6; --warm: #d9541e; --ok: #2e7d4f; --bad: #b3261e;
    --shadow: 0 1px 2px rgba(40, 30, 20, .04), 0 4px 16px rgba(40, 30, 20, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #141210; --card: #1e1b18; --ink: #f2eee9; --muted: #a8a198; --faint: #7d776f;
      --line: #322d28; --soft: #26221e;
      --on: #f5b52a; --on-soft: #3a2f14; --on-ink: #ffd27a;
      --blue: #3987e5; --warm: #ff7a45; --ok: #5cc28a; --bad: #ff8a80;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 16px;
         padding: 18px 28px; flex-wrap: wrap; max-width: 1500px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo { width: 36px; height: 36px; display: block; }
  .brand h1 { font-size: 22px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  .status { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--muted); }
  .msg.err { color: var(--bad); }
  main { padding: 0 28px 40px; max-width: 1500px; margin: 0 auto; }

  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; margin-bottom: 18px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  @media (max-width: 1100px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 820px) {
    .bar { padding: 16px; } main { padding: 0 12px 32px; }
    .layout { grid-template-columns: minmax(0, 1fr); }
    .tiles { gap: 10px; }
  }

  .card, .tile { background: var(--card); border: 1px solid var(--line); border-radius: 18px;
                 box-shadow: var(--shadow); min-width: 0; }
  .card { padding: 20px 22px; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
  .title { font-size: 14px; font-weight: 600; margin: 0; }
  .sub { font-size: 13px; color: var(--muted); margin: 0; }

  a.tile { display: block; padding: 16px 18px; color: inherit; text-decoration: none; }
  a.tile:hover { border-color: var(--faint); }
  .tile .k { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .tile .k svg { width: 16px; height: 16px; }
  .tile .v { font-size: 28px; font-weight: 400; margin: 6px 0 2px; font-variant-numeric: tabular-nums;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .v small { font-size: 15px; color: var(--muted); }
  .tile .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.alert { background: var(--warm); }

  /* switches */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .sw { position: relative; text-align: left; border: 1px solid var(--line); background: var(--soft);
        border-radius: 16px; padding: 14px; cursor: pointer; font: inherit; color: inherit;
        display: flex; flex-direction: column; gap: 10px; min-height: 118px; transition: background .15s, border-color .15s; }
  .sw:hover { border-color: var(--faint); }
  .sw.on { background: var(--on-soft); border-color: var(--on); }
  .sw.off-line { opacity: .55; cursor: default; }
  .sw .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
            background: var(--card); color: var(--muted); }
  .sw.on .ic { background: var(--on); color: #fff; }
  .sw .ic svg { width: 20px; height: 20px; }
  .sw .nm { font-weight: 600; font-size: 15px; line-height: 1.25; }
  .sw .st { font-size: 12px; color: var(--muted); margin-top: auto; }
  .sw.on .st { color: var(--on-ink); }
  .sw input[type=range] { width: 100%; accent-color: var(--on); margin: 0; }
  .sw.busy { opacity: .6; cursor: wait; }

  .media { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 12px; }
  @media (max-width: 1100px) { .media { grid-template-columns: 1fr 1fr; } .media .tv { grid-column: 1 / -1; } }
  .dev { border: 1px solid var(--line); background: var(--soft); border-radius: 16px; padding: 14px;
         display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .dev.live { background: var(--card); }
  .dev .top { display: flex; align-items: center; gap: 10px; }
  .dev .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
             background: var(--card); color: var(--muted); flex: none; }
  .dev.live .ic { background: var(--blue); color: #fff; }
  .dev .ic svg { width: 20px; height: 20px; }
  .dev .nm { font-weight: 600; }
  .dev .st { font-size: 13px; color: var(--muted); }
  .dev .game { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dev .ctrls { display: flex; gap: 6px; flex-wrap: wrap; }
  .dev .ctrls button, .apps button { font: inherit; font-size: 13px; border: 1px solid var(--line);
            background: var(--card); color: var(--ink); border-radius: 10px; padding: 7px 11px; cursor: pointer; }
  .dev .ctrls button:hover, .apps button:hover { border-color: var(--faint); }
  .dev .ctrls button.pw { background: var(--blue); border-color: var(--blue); color: #fff; }
  .apps { display: flex; gap: 6px; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--warm); }
  .playing { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .playing > div { min-width: 0; }
  .playing img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex: none; }
  :root { --wx-cloud: #c9ced6; }
  @media (prefers-color-scheme: dark) { :root { --wx-cloud: #8a919c; } }
  .wx-now { display: grid; grid-template-columns: auto auto 1fr; gap: 14px; align-items: center; }
  .wx-big svg { width: 64px; height: 64px; display: block; }
  .wx-t { font-size: 42px; font-weight: 300; line-height: 1; }
  .wx-d { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .wx-side { font-size: 13px; color: var(--muted); display: grid; gap: 2px; justify-self: end; text-align: right; }
  .wx-side b { color: var(--ink); font-weight: 500; }
  .wx-hours { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(44px, 1fr); gap: 4px;
              margin: 16px 0 10px; overflow-x: auto; padding-bottom: 4px; }
  .wx-h { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; }
  .wx-ht { color: var(--muted); }
  .wx-i svg { width: 26px; height: 26px; display: block; }
  .wx-tt { font-weight: 500; }
  .wx-r { font-size: 11px; color: var(--faint); }
  .wx-r.wet { color: var(--blue); font-weight: 600; }
  .wx-days { display: grid; gap: 2px; border-top: 1px solid var(--line); padding-top: 8px; }
  .wx-day { display: grid; grid-template-columns: 52px 30px 1fr auto; align-items: center; gap: 8px; font-size: 14px; }
  .wx-day .lo { color: var(--muted); }
  @media (max-width: 420px) { .wx-now { grid-template-columns: auto 1fr; } .wx-side { grid-column: 1 / -1; justify-self: start; text-align: left; } }

  .echos { display: flex; flex-direction: column; }
  .echo { padding: 10px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .echo:first-child { border-top: 0; padding-top: 0; }
  .er { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .er .r { margin-left: auto; color: var(--muted); font-size: 13px; text-align: right; }
  .enext { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-left: 18px; }
  .enext svg, .chip svg, .vol svg, .np-ph svg { width: 15px; height: 15px; }
  .np { display: flex; align-items: center; gap: 10px; background: var(--soft); border-radius: 12px; padding: 8px; margin-left: 18px; }
  .np img, .np-ph { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex: none;
                    display: grid; place-items: center; background: var(--line); color: var(--muted); }
  .np-t { min-width: 0; flex: 1; }
  .np-1 { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-2 { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-b { display: flex; gap: 4px; flex: none; }
  .np-b button { font: inherit; font-size: 14px; width: 32px; height: 32px; border-radius: 999px; border: 1px solid var(--line);
                 background: var(--card); color: var(--ink); cursor: pointer; padding: 0; }
  .ec { display: flex; align-items: center; gap: 10px; margin-left: 18px; flex-wrap: wrap; }
  .vol { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; flex: 1; min-width: 150px; }
  .vol input { flex: 1; accent-color: var(--blue); }
  .vol span { min-width: 22px; text-align: right; font-variant-numeric: tabular-nums; }
  .chip { font: inherit; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line);
          background: var(--card); color: var(--muted); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  .chip.on { background: #3b3f73; border-color: #3b3f73; color: #fff; }
  .routines { display: flex; flex-wrap: wrap; gap: 8px; }
  .routines button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--soft);
                     color: var(--ink); border-radius: 999px; padding: 9px 14px; cursor: pointer; }
  .routines button:hover { border-color: var(--faint); }

  .list { list-style: none; margin: 0; padding: 0; font-size: 14px; }
  .list li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .list li:first-child { border-top: 0; }
  .list .r { margin-left: auto; color: var(--muted); font-size: 13px; text-align: right; }
  .list .when { color: var(--muted); min-width: 72px; font-variant-numeric: tabular-nums; }
  .list .bad { color: var(--bad); }
  .empty { color: var(--muted); font-size: 14px; padding: 16px 0; }
  .iconbtn { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
             border-radius: 999px; padding: 5px 12px; cursor: pointer; }

  .pin { text-align: center; padding: 40px 20px; max-width: 380px; margin: 60px auto; }
  .pin input { font: inherit; font-size: 28px; letter-spacing: .4em; text-align: center; width: 180px; padding: 10px;
               border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin: 14px 0; }
  .pin button { width: 180px; font: inherit; padding: 11px; border: 0; border-radius: 12px; background: var(--blue); color: #fff; cursor: pointer; }
  @media (max-width: 820px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .sw { min-height: 104px; }
  }
  .demo-bar { background: var(--blue); color: #fff; text-align: center; font-size: 13px; padding: 8px 16px; }
  .demo-bar a { color: #fff; font-weight: 600; }
</style>
</head>
<body>
<div class="demo-bar">Demo with a pretend house. Everything works, nothing is real.
  <a href="./">About Moby's Home</a> · <a href="https://github.com/cs97jjm3/mobys-home">Code on GitHub</a></div>
<header class="bar">
  <div class="brand"><svg class="logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="mh-home" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b8fe0"/><stop offset="1" stop-color="#1c5cab"/></linearGradient></defs><rect width="512" height="512" rx="116" fill="url(#mh-home)"/><path d="M256 118 L392 236 C 400 243, 396 256, 385 256 L 364 256 L 364 372 C 364 384, 356 392, 344 392 L 168 392 C 156 392, 148 384, 148 372 L 148 256 L 127 256 C 116 256, 112 243, 120 236 Z" fill="#fff"/><path d="M226 392 L226 318 C226 306, 234 298, 246 298 L266 298 C278 298, 286 306, 286 318 L286 392 Z" fill="url(#mh-home)"/><circle cx="256" cy="210" r="22" fill="#f5823f"/></svg><h1>Moby's Home</h1></div>
  <div class="status"><span class="msg" id="msg"></span><span id="updated"></span>
    <button class="iconbtn" onclick="refreshNow()" title="Ask Alexa for the latest now">Refresh</button></div>
</header>
<main id="app"><div class="card">Loading…</div></main>

<script>if (window.self !== window.top) document.querySelector(".demo-bar").remove();</script>
<script src="demo-data.js"></script>
<script>
const state = { data: null, busy: {}, skew: 0, locked: false };
const $ = id => document.getElementById(id);
const nowSec = () => Date.now() / 1000 + state.skew;

const ICONS = {
  Light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2V16h5v-.2c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/></svg>',
  Plug: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0V7zM12 17v5"/></svg>',
  Switch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="3" width="12" height="18" rx="3"/><path d="M12 8v4"/></svg>',
  Fan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="2"/><path d="M12 10c0-4 1-7 4-7 2 0 2 3 0 5M14 12c4 0 7 1 7 4 0 2-3 2-5 0M12 14c0 4-1 7-4 7-2 0-2-3 0-5M10 12c-4 0-7-1-7-4 0-2 3-2 5 0"/></svg>',
  flame: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3c2 3 5 5 5 9a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 1.5.8 2.5 2 3-.6-2.5-.4-5 1-7.5z"/></svg>',
  flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
  door: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M3 21h18M14 12h.01"/></svg>',
  tv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
  pad: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8h10a4 4 0 0 1 4 4v3a3 3 0 0 1-5.4 1.8L14.5 15h-5l-1.1 1.8A3 3 0 0 1 3 15v-3a4 4 0 0 1 4-4z"/><path d="M8 11v3M6.5 12.5h3M15.5 12h.01M17.5 13.5h.01"/></svg>',
  music: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  speaker: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5zM15.5 8.5a5 5 0 0 1 0 7"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/></svg>',
  timer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M10 2h4"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/></svg>',
};

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function clock(ts) { return new Date(ts * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}); }
function ago(ts) {
  if (!ts) return "";
  const m = Math.round((nowSec() - ts) / 60);
  if (m < 1) return "just now";
  if (m < 60) return `${m} min ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} h ago`;
  return new Date(ts * 1000).toLocaleDateString([], {weekday: "short", day: "numeric"});
}
function when(ts) {
  const d = new Date(ts * 1000);
  return d.toDateString() === new Date().toDateString() ? clock(ts)
    : d.toLocaleDateString([], {weekday: "short"}) + " " + clock(ts);
}
function lightWord(lux) {
  if (lux == null) return "";
  if (lux < 10) return "dark"; if (lux < 50) return "dim"; if (lux < 200) return "lit"; return "bright";
}
function fmt(t) { return t == null ? "–" : t.toFixed(1) + "°"; }

// ---------- PIN ----------
function showPin(error) {
  state.locked = true;
  $("app").innerHTML = `<div class="card pin"><div>Enter the PIN</div>
    <form onsubmit="sendPin(event)"><input id="pin" type="password" inputmode="numeric" autocomplete="off"><br>
    <button type="submit">Unlock</button></form></div>`;
  message(error || "", !!error);
  setTimeout(() => $("pin") && $("pin").focus(), 50);
}
async function sendPin(e) {
  e.preventDefault();
  const r = await fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({pin: $("pin").value})});
  const d = await r.json();
  if (d.ok) { state.locked = false; message(""); load(); } else showPin(d.error);
}

// ---------- page ----------
function render() {
  const d = state.data;
  if (!d) return;
  const a = d.alexa;
  $("app").innerHTML = `
    <div class="tiles">${heatingTile(d.heating)}${raceTile(d.race)}${doorTiles(a.sensors)}</div>
    <div class="layout">
      <div class="col">
        <div class="card">
          <div class="head"><p class="title">Lights and plugs</p>
            <p class="sub">${a.switches.filter(s => s.power === "ON").length} on</p></div>
          ${a.switches.length ? `<div class="grid">${a.switches.map(switchTile).join("")}</div>`
            : '<p class="empty">No lights or plugs found in Alexa yet.</p>'}
        </div>
        ${mediaCard(d.devices)}
        <div class="card">
          <div class="head"><p class="title">Routines</p><p class="sub">tap to run</p></div>
          ${a.routines.length ? `<div class="routines">${a.routines.map(r =>
            `<button onclick='runRoutine(${JSON.stringify(r).replace(/'/g, "&#39;")})'>${esc(r.replace(/^alexa,\s*/i, ""))}</button>`).join("")}</div>`
            : '<p class="empty">No routines found.</p>'}
        </div>
      </div>
      <div class="col">
        ${weatherCard(d.weather)}
        <div class="card"><div class="head"><p class="title">Echos</p></div>${echoList(a)}</div>
        <div class="card"><div class="head"><p class="title">Recent changes</p></div>${logList(d.log)}</div>
      </div>
    </div>`;
  if (a.error) message("Alexa: " + a.error, true);
}

function heatingTile(h) {
  if (!h || !h.running) return `<a class="tile" href="${esc(h && h.link)}" target="_blank" rel="noopener" onclick="return openWindow(this.href, 'mobys-heat')">
    <div class="k">${ICONS.flame}Heating</div><div class="v">–</div><div class="s">Moby's Heat isn't answering</div></a>`;
  if (h.error || h.room == null) return `<a class="tile" href="${esc(h.link)}" target="_blank" rel="noopener" onclick="return openWindow(this.href, 'mobys-heat')">
    <div class="k">${ICONS.flame}Heating</div><div class="v">–</div>
    <div class="s">${h.error === "PIN needed" ? "Add Moby's Heat's PIN to home_config.ini" : esc(h.error || "No reading yet")}</div></a>`;
  let mode = h.mode || "";
  if (h.boost_ends) {
    const mins = Math.max(0, Math.ceil((h.boost_ends - nowSec()) / 60));
    mode = `Boost · ${mins} min left`;
  }
  return `<a class="tile" href="${esc(h.link)}" target="_blank" rel="noopener" onclick="return openWindow(this.href, 'mobys-heat')">
    <div class="k" style="color:var(--warm)">${ICONS.flame}<span style="color:var(--muted)">Heating</span></div>
    <div class="v">${fmt(h.room)}</div>
    <div class="s">Set ${fmt(h.target)} · ${esc(mode)}${h.outside != null ? ` · ${fmt(h.outside)} out` : ""}</div></a>`;
}

// At home (opened as http://pc-name:port) go straight to the race dashboard on the same PC,
// which lets home Wi-Fi in without a code. Through a web address, use its web address.
function raceLink(r) {
  return location.protocol === "http:" ? `http://${location.hostname}:${r.port || 8080}` : r.link;
}

function raceTile(r) {
  return `<a class="tile" href="${esc(raceLink(r))}" target="_blank" rel="noopener" onclick="return openWindow(this.href, 'race-dashboard')">
    <div class="k">${ICONS.flag}Race dashboard</div>
    <div class="v" style="font-size:22px;padding:4px 0 3px"><span class="dot ${r.running ? "ok" : ""}"></span>
      ${r.running ? "Running" : "Not running"}</div>
    <div class="s">Open the pit wall</div></a>`;
}

function doorTiles(sensors) {
  const shown = sensors.slice(0, 2);
  while (shown.length < 2) shown.push(null);
  return shown.map(s => {
    if (!s) return `<div class="tile" style="padding:16px 18px"><div class="k">${ICONS.door}Front door</div>
      <div class="v">–</div><div class="s">No door sensors found</div></div>`;
    const icon = s.kind === "SECURITY_PANEL" ? ICONS.shield : ICONS.door;
    let big, small;
    if (s.motion) {
      const moving = s.motion === "DETECTED";
      big = `<span class="dot ${moving ? "alert" : "ok"}"></span> ${moving ? "Motion" : "All quiet"}`;
      small = s.motion_changed ? `${moving ? "Since" : "Last motion"} ${ago(s.motion_changed)}` : "";
    } else {
      big = `<span class="dot ${s.reachable ? "ok" : "bad"}"></span> ${s.reachable ? "Connected" : "Not responding"}`;
      small = s.maker;
    }
    return `<div class="tile" style="padding:16px 18px"><div class="k">${icon}${esc(s.name)}</div>
      <div class="v" style="font-size:22px;padding:4px 0 3px">${big}</div><div class="s">${esc(small)}</div></div>`;
  }).join("");
}

function switchTile(s) {
  const on = s.power === "ON";
  const off = !s.reachable;
  const busy = state.busy[s.id];
  const status = off ? "Not responding" : busy ? "Changing…"
    : on ? (s.brightness != null && s.can_dim ? `On · ${s.brightness}%` : "On") : "Off";
  const slider = on && s.can_dim && !off
    ? `<input type="range" min="1" max="100" value="${s.brightness ?? 100}" aria-label="Brightness"
         onclick="event.stopPropagation()" onchange="setBrightness('${s.id}', this.value)">` : "";
  return `<button class="sw ${on && !off ? "on" : ""} ${off ? "off-line" : ""} ${busy ? "busy" : ""}"
      ${off ? "disabled" : ""} onclick="toggle('${s.id}')" aria-pressed="${on}">
    <span class="ic">${ICONS[s.label] || ICONS.Switch}</span>
    <span class="nm">${esc(s.name)}</span>${slider}<span class="st">${status}</span></button>`;
}

function mediaCard(dev) {
  if (!dev || !Object.keys(dev).length) return "";
  const parts = [];
  if (dev.tv) parts.push(tvTile(dev.tv));
  if (dev.ps5) parts.push(consoleTile(dev.ps5, {on: "On", rest: "Rest mode", off: "Off"}));
  if (dev.xbox) parts.push(consoleTile(dev.xbox, {on: "On", asleep: "Asleep", off: "Off"}));
  return `<div class="card"><div class="head"><p class="title">TV and consoles</p></div>
    <div class="media">${parts.join("")}</div></div>`;
}

function tvTile(t) {
  const on = t.state === "on";
  const words = {on: "On", standby: "Standby", off: "Off"};
  const apps = on && t.apps.length ? `<div class="apps">${t.apps.slice(0, 8).map(a =>
      `<button onclick='tv("app", ${JSON.stringify(a.id)}, ${JSON.stringify(a.name).replace(/'/g, "&#39;")})'>${esc(a.name)}</button>`).join("")}</div>` : "";
  const ctrls = on
    ? `<div class="ctrls"><button class="pw" onclick="tv('power_off')">Turn off</button>
        <button onclick="tv('volume_down')" aria-label="Volume down">Vol −</button>
        <button onclick="tv('volume_up')" aria-label="Volume up">Vol +</button>
        <button onclick="tv('mute')">Mute</button></div>`
    : `<div class="ctrls"><button class="pw" onclick="tv('power_on')">Turn on</button></div>`;
  return `<div class="dev tv ${on ? "live" : ""}">
    <div class="top"><span class="ic">${ICONS.tv}</span><div><div class="nm">${esc(t.label)}</div>
      <div class="st">${words[t.state] || t.state}${t.model ? " · " + esc(t.model) : ""}</div></div></div>
    ${ctrls}${apps}
    ${t.needs_allow ? '<div class="hint">Look at the TV and choose Allow, then try again.</div>' : ""}</div>`;
}

function consoleTile(c, words) {
  const on = c.state === "on";
  return `<div class="dev ${on ? "live" : ""}">
    <div class="top"><span class="ic">${ICONS.pad}</span><div><div class="nm">${esc(c.label)}</div>
      <div class="st">${words[c.state] || c.state}</div></div></div>
    ${on && c.game ? `<div class="playing">${c.game_icon ? `<img src="${esc(c.game_icon)}" alt="" loading="lazy">` : ""}
      <div><div class="st">Playing</div><div class="game" title="${esc(c.game)}">${esc(c.game)}</div></div></div>` : ""}
    ${c.psn_warning ? `<div class="hint">${esc(c.psn_warning)}</div>` : ""}</div>`;
}

async function tv(action, appId, appName) {
  message(action === "power_on" ? "Waking the TV…" : "Sending to the TV…");
  try { apply(await post("/api/tv", {action, app_id: appId, app_name: appName})); message(""); }
  catch (e) { if (e.message !== "PIN needed") message(e.message, true); }
}

function echoList(a) {
  if (!a.echos.length) return '<p class="empty">No Echos found.</p>';
  const light = {};
  a.rooms.forEach(r => light[r.name] = r);
  return `<div class="echos">${a.echos.map(e => {
    const room = light[e.name];
    const bits = [];
    if (room && room.lux != null) bits.push(`${lightWord(room.lux)} (${Math.round(room.lux)} lux)`);
    if (room && room.temperature != null) bits.push(fmt(room.temperature));
    if (!e.online) bits.push("offline");
    if (e.dnd) bits.push("Do Not Disturb");
    const next = e.next ? nextText(e.next) : "";
    const media = e.online && e.has_media ? `<div class="np">
        ${e.art ? `<img src="${esc(e.art)}" alt="" loading="lazy">` : `<span class="np-ph">${ICONS.music}</span>`}
        <div class="np-t"><div class="np-1">${esc(e.title || "")}</div><div class="np-2">${esc(e.subtitle || "")}</div></div>
        <div class="np-b">
          <button onclick="echo('${e.serial}', 'previous')" aria-label="Previous">⏮</button>
          <button onclick="echo('${e.serial}', '${e.playing ? "pause" : "play"}')" aria-label="${e.playing ? "Pause" : "Play"}">${e.playing ? "⏸" : "▶"}</button>
          <button onclick="echo('${e.serial}', 'next')" aria-label="Next">⏭</button>
        </div></div>` : "";
    const controls = e.online && e.volume != null ? `<div class="ec">
        <span class="vol">${ICONS.speaker}<input type="range" min="0" max="100" value="${e.volume}"
          aria-label="Volume" onchange="echo('${e.serial}', 'volume', +this.value)"><span>${e.volume}</span></span>
        ${e.dnd != null ? `<button class="chip ${e.dnd ? "on" : ""}" onclick="echo('${e.serial}', 'dnd', ${!e.dnd})"
          title="Do Not Disturb">${ICONS.moon} ${e.dnd ? "DND on" : "DND"}</button>` : ""}</div>` : "";
    return `<div class="echo">
      <div class="er"><span class="dot ${e.online ? "ok" : ""}"></span><span class="en">${esc(e.name)}</span>
        <span class="r">${esc(bits.join(" · ") || e.model || "")}</span></div>
      ${next ? `<div class="enext">${next}</div>` : ""}${media}${controls}</div>`;
  }).join("")}</div>`;
}

function nextText(n) {
  const mins = Math.round((n.at - nowSec()) / 60);
  if (n.kind.toLowerCase().includes("timer")) {
    const left = mins >= 60 ? `${Math.floor(mins / 60)} h ${mins % 60} min` : `${Math.max(0, mins)} min`;
    return `${ICONS.timer} Timer${n.label ? " " + esc(n.label) : ""}: ${left} left`;
  }
  const kind = n.kind.toLowerCase().includes("reminder") ? "Reminder" : "Alarm";
  return `${ICONS.bell} ${kind} ${when(n.at)}${n.label ? " · " + esc(n.label) : ""}`;
}

async function echo(serial, action, value) {
  try { apply(await post("/api/echo", {serial, action, value})); message(""); }
  catch (e) { if (e.message !== "PIN needed") message(e.message, true); }
}

// ---------- weather ----------
const WX = {
  clear: '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="6.5" fill="#f5b52a"/><g stroke="#f5b52a" stroke-width="2.2" stroke-linecap="round"><path d="M16 3v3.5M16 25.5V29M3 16h3.5M25.5 16H29M6.8 6.8l2.5 2.5M22.7 22.7l2.5 2.5M6.8 25.2l2.5-2.5M22.7 9.3l2.5-2.5"/></g></svg>',
  "clear-night": '<svg viewBox="0 0 32 32"><path d="M21 5a11 11 0 1 0 6 19A12 12 0 0 1 21 5z" fill="#9bb4d6"/></svg>',
  part: '<svg viewBox="0 0 32 32"><circle cx="12" cy="11" r="5.5" fill="#f5b52a"/><path d="M10 26h14a5 5 0 0 0 0-10 7 7 0 0 0-13.4 1.6A4.3 4.3 0 0 0 10 26z" fill="var(--wx-cloud)"/></svg>',
  "part-night": '<svg viewBox="0 0 32 32"><path d="M15 4a8 8 0 1 0 4 14A9 9 0 0 1 15 4z" fill="#9bb4d6"/><path d="M10 27h14a5 5 0 0 0 0-10 7 7 0 0 0-13.4 1.6A4.3 4.3 0 0 0 10 27z" fill="var(--wx-cloud)"/></svg>',
  cloud: '<svg viewBox="0 0 32 32"><path d="M8 25h16a6 6 0 0 0 0-12 8 8 0 0 0-15.5 2A5 5 0 0 0 8 25z" fill="var(--wx-cloud)"/></svg>',
  fog: '<svg viewBox="0 0 32 32"><path d="M8 17h16a5 5 0 0 0 0-10 7 7 0 0 0-13.4 1.6A4.3 4.3 0 0 0 8 17z" fill="var(--wx-cloud)"/><path d="M6 21h20M9 25h14" stroke="var(--wx-cloud)" stroke-width="2.2" stroke-linecap="round"/></svg>',
  drizzle: '<svg viewBox="0 0 32 32"><path d="M8 19h16a5 5 0 0 0 0-10 7 7 0 0 0-13.4 1.6A4.3 4.3 0 0 0 8 19z" fill="var(--wx-cloud)"/><path d="M11 23v2M16 23v2M21 23v2" stroke="#3987e5" stroke-width="2.2" stroke-linecap="round"/></svg>',
  rain: '<svg viewBox="0 0 32 32"><path d="M8 18h16a5 5 0 0 0 0-10 7 7 0 0 0-13.4 1.6A4.3 4.3 0 0 0 8 18z" fill="var(--wx-cloud)"/><path d="M11 21l-1.5 5M16 21l-1.5 5M21 21l-1.5 5" stroke="#3987e5" stroke-width="2.2" stroke-linecap="round"/></svg>',
  showers: '<svg viewBox="0 0 32 32"><circle cx="11" cy="10" r="5" fill="#f5b52a"/><path d="M9 20h15a5 5 0 0 0 0-10 7 7 0 0 0-13.4 1.6A4.3 4.3 0 0 0 9 20z" fill="var(--wx-cloud)"/><path d="M13 23l-1.2 4M19 23l-1.2 4" stroke="#3987e5" stroke-width="2.2" stroke-linecap="round"/></svg>',
  snow: '<svg viewBox="0 0 32 32"><path d="M8 18h16a5 5 0 0 0 0-10 7 7 0 0 0-13.4 1.6A4.3 4.3 0 0 0 8 18z" fill="var(--wx-cloud)"/><g fill="#7fb3e8"><circle cx="11" cy="23" r="1.6"/><circle cx="16" cy="26" r="1.6"/><circle cx="21" cy="23" r="1.6"/></g></svg>',
  thunder: '<svg viewBox="0 0 32 32"><path d="M8 17h16a5 5 0 0 0 0-10 7 7 0 0 0-13.4 1.6A4.3 4.3 0 0 0 8 17z" fill="var(--wx-cloud)"/><path d="M17 18l-4 6h4l-2 5 6-8h-4l2-3z" fill="#f5b52a"/></svg>',
};
const wxIcon = k => WX[k] || WX.cloud;
const deg = t => t == null ? "–" : Math.round(t) + "°";

function weatherCard(w) {
  if (!w) return "";
  if (!w.now) return `<div class="card"><div class="head"><p class="title">Weather</p></div>
    <p class="empty">${w.error ? "Couldn't get the weather: " + esc(w.error) : "Getting the weather…"}</p></div>`;
  const t = w.today || {};
  return `<div class="card wx">
    <div class="head"><p class="title">Weather</p><p class="sub">${esc(w.rain_note || "")}</p></div>
    <div class="wx-now">
      <span class="wx-big">${wxIcon(w.now.icon)}</span>
      <div><div class="wx-t">${deg(w.now.temp)}</div><div class="wx-d">${esc(w.now.text)}</div></div>
      <div class="wx-side">
        <div>Feels like <b>${deg(w.now.feels)}</b></div>
        <div>Wind <b>${w.now.wind == null ? "–" : Math.round(w.now.wind)} mph</b>${w.now.gusts ? `, gusts ${Math.round(w.now.gusts)}` : ""}</div>
        <div>High <b>${deg(t.high)}</b> · Low <b>${deg(t.low)}</b></div>
        <div>Sun ${esc(t.sunrise || "")} – ${esc(t.sunset || "")}</div>
      </div>
    </div>
    <div class="wx-hours">${(w.hours || []).slice(0, 8).map(h => `<div class="wx-h" title="${esc(h.text)}">
      <span class="wx-ht">${esc(h.time)}</span><span class="wx-i">${wxIcon(h.icon)}</span>
      <span class="wx-tt">${deg(h.temp)}</span><span class="wx-r ${h.rain >= 50 ? "wet" : ""}">${h.rain ?? 0}%</span></div>`).join("")}</div>
    <div class="wx-days">${(w.days || []).slice(1, 6).map(d => `<div class="wx-day" title="${esc(d.text)}">
      <span>${esc(d.day)}</span><span class="wx-i">${wxIcon(d.icon)}</span>
      <span><b>${deg(d.high)}</b> <span class="lo">${deg(d.low)}</span></span>
      <span class="wx-r ${d.rain >= 50 ? "wet" : ""}">${d.rain ?? 0}%</span></div>`).join("")}</div>
  </div>`;
}

function logList(log) {
  if (!log.length) return '<p class="empty">Nothing changed from here yet.</p>';
  return `<ul class="list">${log.map(l => `<li><span class="when">${when(l.ts)}</span>
    <span class="${l.ok ? "" : "bad"}">${esc(l.text)}</span></li>`).join("")}</ul>`;
}

// Open a dashboard in its own window, or bring it to the front if it's already open
function openWindow(url, name) {
  const w = Math.min(1500, screen.availWidth - 40), h = Math.min(950, screen.availHeight - 40);
  const win = window.open(url, name, `popup,width=${w},height=${h},left=20,top=20`);
  if (!win) return true;        // pop-ups blocked: fall back to a new tab
  win.focus();
  return false;
}

// ---------- actions ----------
function message(text, err) { $("msg").textContent = text; $("msg").className = "msg" + (err ? " err" : ""); }
function stamp() {
  const t = state.data && state.data.alexa.updated;
  $("updated").textContent = t ? "Alexa checked " + clock(t) : "";
}

async function getJSON(url, opts) {
  const r = await fetch(url, opts);
  const d = await r.json();
  if (d.need_pin) { showPin(); throw new Error("PIN needed"); }
  if (!d.ok) throw new Error(d.error);
  return d;
}
const post = (url, body) => getJSON(url, {method: "POST", headers: {"Content-Type": "application/json"},
                                         body: JSON.stringify(body || {})});

function apply(d) {
  state.data = d;
  state.skew = d.now - Date.now() / 1000;
  render(); stamp();
}

async function toggle(id) {
  const s = state.data.alexa.switches.find(x => x.id === id);
  if (!s || state.busy[id]) return;
  const turnOn = s.power !== "ON";
  state.busy[id] = true; render();
  try { apply(await post("/api/switch", {id, on: turnOn})); message(""); }
  catch (e) { if (e.message !== "PIN needed") message(e.message, true); }
  finally { delete state.busy[id]; render(); }
}

async function setBrightness(id, value) {
  state.busy[id] = true; render();
  try { apply(await post("/api/switch", {id, brightness: +value})); message(""); }
  catch (e) { if (e.message !== "PIN needed") message(e.message, true); }
  finally { delete state.busy[id]; render(); }
}

async function runRoutine(name) {
  if (!confirm(`Run "${name.replace(/^alexa,\s*/i, "")}"?`)) return;
  message(`Running ${name}…`);
  try { apply(await post("/api/routine", {name})); message(`Ran ${name}`); }
  catch (e) { if (e.message !== "PIN needed") message(e.message, true); }
}

async function refreshNow() {
  message("Asking Alexa…");
  try { apply(await post("/api/refresh")); message(""); }
  catch (e) { if (e.message !== "PIN needed") message(e.message, true); }
}

async function load() {
  try {
    const d = await getJSON("/api/status");
    if (!Object.keys(state.busy).length) apply(d);
    if (!$("msg").classList.contains("err") || !d.alexa.error) message("");
  } catch (e) {
    if (e.message !== "PIN needed") message("Can't reach Moby's Home: " + e.message, true);
  }
}

load();
setInterval(() => { if (!state.locked) load(); }, 20000);
</script>
