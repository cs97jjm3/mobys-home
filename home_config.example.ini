# Settings for Moby's Home.
# Copy this file to home_config.ini and fill it in. Keep it private.

[dashboard]
# Numbers only. Needs at least 6 numbers if you use a web address below.
pin =
# yes = reachable from other devices on your home network
share = yes
port = 8095

[location]
# A UK postcode, for the weather
postcode =

[cloudflare]
# Optional: your own web address, e.g. home.example.co.uk. Set the tunnel up first.
hostname =
tunnel = home-dashboard

[alexa]
# Made by alexa_peek.py the first time you log in
login_file = alexa_login.json
# Echo that routines run on (anything a routine says is said there)
routine_echo =
# Devices, Echos or routines to leave off the page, separated by commas
hide =

[heating]
# Moby's Heat, if it's running on this computer
url = http://localhost:8090
# Moby's Heat's PIN, if it has one
pin =
# Where the heating tile takes you
link =

[devices]
# The TV and consoles. Leave an address blank to leave it off the page.
tv =
tv_mac =
tv_name = Samsung TV
ps5 =
ps5_name = PS5
xbox =
xbox_name = Xbox

[playstation]
# Optional: shows what's being played on the PS5, from your PlayStation account.
# Unofficial, so it's light on how often it checks. See the README for how to
# get the code. Keep it private, like a password. It lasts about two months.
npsso =
# Leave blank for the account the code belongs to
online_id =

[race]
url = http://localhost:8080
link =
